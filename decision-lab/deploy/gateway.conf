# Rendered by workshop.py. The upstream is the copied original notebook Service.
map $http_upgrade $decision_lab_connection {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    # Preserve the browser's TLS origin behind ingress; do not synthesize an
    # absolute redirect from this internal HTTP listener and port.
    absolute_redirect off;
    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 90s;

    # Keep the public host: the app checks browser Origin against this value.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;

    location = /decision-lab {
        return 302 /decision-lab/;
    }

    location = /_decision_lab_auth {
        internal;
        proxy_pass http://@@NOTEBOOK_UPSTREAM@@/api/me;
        proxy_method GET;
        proxy_pass_request_body off;
        # Nginx inherits proxy_set_header only when this block defines none.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location @decision_lab_login {
        return 302 /login?next=%2Fdecision-lab%2F;
    }

    location /decision-lab/ {
        auth_request /_decision_lab_auth;
        error_page 401 403 = @decision_lab_login;
        # Authentication uses the original request in the separate subrequest.
        # Forward no notebook credentials to the Python app after that check.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        # A trailing slash strips only the public app prefix.
        proxy_pass http://127.0.0.1:8081/;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://@@NOTEBOOK_UPSTREAM@@;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $decision_lab_connection;
        proxy_buffering off;
    }
}
